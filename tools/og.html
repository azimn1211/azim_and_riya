<!doctype html>
<!-- Source for website/assets/og-image.jpg (the WhatsApp / social link preview).
     Render: see tools/README in ../README.md -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri&family=EB+Garamond:wght@500;600&family=Great+Vibes&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #fbf7f0 url(../website/assets/paper.webp) center / 360px;
    font-family: 'EB Garamond', serif;
    color: #3b3250;
    text-align: center;
  }
  .frame { position: absolute; inset: 22px; border: 1.5px solid rgba(168, 130, 60, .55); border-radius: 6px; }
  .frame::after { content: ''; position: absolute; inset: 6px; border: 1px solid rgba(168, 130, 60, .3); border-radius: 3px; }
  .tl { position: absolute; left: -120px; top: -150px; width: 560px; }
  .br { position: absolute; right: -170px; bottom: -215px; width: 520px; transform: rotate(180deg); }
  .fr { position: absolute; right: 70px; top: -30px; width: 150px; transform: rotate(196deg); transform-origin: 50% 0; }
  .fl { position: absolute; left: 60px; bottom: -40px; width: 150px; transform: rotate(-14deg); }
  .content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .bis { font-family: 'Amiri', serif; font-size: 34px; color: #86662a; }
  .names { font-family: 'Great Vibes', cursive; font-size: 132px; line-height: 1.05; margin: 2px 0 0; }
  .names span { font-size: 70px; color: #a8823c; margin: 0 14px; }
  .line { display: flex; align-items: center; gap: 16px; margin: 10px 0 12px; color: #a8823c; }
  .line i { width: 90px; height: 1px; background: currentColor; opacity: .7; }
  .date { font-weight: 600; font-size: 30px; letter-spacing: .18em; text-transform: uppercase; }
  .place { margin-top: 6px; font-size: 25px; letter-spacing: .08em; color: #86662a; }
</style>
</head>
<body>
  <img class="fr" src="../website/assets/flowers/frond-soft.webp" alt="">
  <img class="fl" src="../website/assets/flowers/stem-peach.webp" alt="">
  <img class="tl" src="../website/assets/flowers/cluster-a.webp" alt="">
  <img class="br" src="../website/assets/flowers/cluster-b.webp" alt="">
  <div class="frame"></div>
  <div class="content">
    <div class="bis">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
    <div class="names">Azim<span>&amp;</span>Riya</div>
    <div class="line"><i></i>✦<i></i></div>
    <div class="date">Nikah · Thursday · 19 November 2026</div>
    <div class="place">Vallakkadavu · Thiruvananthapuram</div>
  </div>
</body>
</html>
